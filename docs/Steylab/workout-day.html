<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SteyLab — Séance</title>
    <meta name="description" content="Exercices de la séance du jour." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="app-page">
    <div class="bg-grid"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <header class="app-header-bar">
      <div class="logo">SteyLab</div>
      <div class="app-header-actions">
        <button class="icon-btn" id="lang-toggle" aria-label="Change language">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm6.9 6h-3.2a15.3 15.3 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4.1A13.6 13.6 0 0 1 13.6 8H10.4A13.6 13.6 0 0 1 12 4.1ZM4.1 14a8 8 0 0 1 0-4h3.5a17 17 0 0 0 0 4Zm.1 2h3.2a15.3 15.3 0 0 0 1.4 3.6A8 8 0 0 1 4.2 16Zm3.2-8H4.2a8 8 0 0 1 4.7-3.6A15.3 15.3 0 0 0 7.4 8ZM12 19.9A13.6 13.6 0 0 1 10.4 16h3.2A13.6 13.6 0 0 1 12 19.9ZM14.4 14h-4.8a14.9 14.9 0 0 1 0-4h4.8a14.9 14.9 0 0 1 0 4Zm.7 5.6a15.3 15.3 0 0 0 1.4-3.6h3.2a8 8 0 0 1-4.6 3.6Zm1.5-5.6a17 17 0 0 0 0-4h3.5a8 8 0 0 1 0 4Z" fill="currentColor"/>
          </svg>
        </button>
        <a class="icon-btn" href="./workout.html" aria-label="Retour séance">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 6 9 12l6 6" fill="none" stroke="currentColor" stroke-width="2" />
          </svg>
        </a>
      </div>
    </header>

    <main class="day-page">
      <div class="day-header">
        <div>
          <h2 id="workout-day-title">Séance</h2>
          <div class="day-meta" id="workout-day-meta"></div>
        </div>
      </div>

      <div class="day-card">
        <h3 data-i18n="app.workout.exercises">Exercices</h3>
        <div class="workout-grid" id="exercise-grid"></div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="./supabase.js"></script>
    <script src="./i18n.js"></script>
    <script src="./workout-day.js"></script>
    <script>
      window.i18n.initLanguageUI();
    </script>
  </body>
</html>
