<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SteyLab — Connexion</title>
    <meta name="description" content="Connecte-toi pour accéder à SteyLab." />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Bebas+Neue&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="app-page">
    <div class="bg-grid"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <header class="app-header-bar">
      <div class="logo">SteyLab</div>
      <div class="app-header-actions">
        <button class="icon-btn" id="lang-toggle" aria-label="Change language">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm6.9 6h-3.2a15.3 15.3 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8ZM12 4.1A13.6 13.6 0 0 1 13.6 8H10.4A13.6 13.6 0 0 1 12 4.1ZM4.1 14a8 8 0 0 1 0-4h3.5a17 17 0 0 0 0 4Zm.1 2h3.2a15.3 15.3 0 0 0 1.4 3.6A8 8 0 0 1 4.2 16Zm3.2-8H4.2a8 8 0 0 1 4.7-3.6A15.3 15.3 0 0 0 7.4 8ZM12 19.9A13.6 13.6 0 0 1 10.4 16h3.2A13.6 13.6 0 0 1 12 19.9ZM14.4 14h-4.8a14.9 14.9 0 0 1 0-4h4.8a14.9 14.9 0 0 1 0 4Zm.7 5.6a15.3 15.3 0 0 0 1.4-3.6h3.2a8 8 0 0 1-4.6 3.6Zm1.5-5.6a17 17 0 0 0 0-4h3.5a8 8 0 0 1 0 4Z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section class="section app-section auth-section">
        <div class="section-head settings-head">
          <div>
            <h2 data-i18n="app.login.title">Connexion</h2>
            <p data-i18n="app.login.subtitle">Connecte-toi pour retrouver ton profil sur tous tes appareils.</p>
          </div>
        </div>
        <div class="app-shell">
          <div class="app-panel">
            <form class="app-form" id="login-form">
              <label class="full">
                <span data-i18n="app.login.email">Email</span>
                <input type="email" name="email" placeholder="toi@email.com" required />
              </label>
              <label class="full">
                <span data-i18n="app.login.password">Mot de passe</span>
                <input type="password" name="password" minlength="6" required />
              </label>
              <div class="form-actions">
                <button class="cta" type="submit" data-i18n="app.login.cta">Se connecter</button>
                <a class="ghost" href="./signup.html" data-i18n="app.login.signup">Créer un compte</a>
              </div>
              <p class="form-status" id="login-status"></p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>SteyLab © 2026 — Application sportive pour femmes & hommes.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <script src="./i18n.js"></script>
    <script src="./login.js"></script>
    <script>
      window.i18n.initLanguageUI();
    </script>
  </body>
</html>
